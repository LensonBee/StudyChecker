{% extends "prefabs/layout.html" %}

{% block content %}
<div class="list">
    <div class="listbox">
        {% for student in students %}
            <div>
                <h1>
                    <i class="fa-solid fa-user"></i>
                    {{ student.student_id }}
                    {{ student.date }}
                </h1>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
